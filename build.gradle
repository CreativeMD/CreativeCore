plugins {
    id 'eclipse'
    id 'idea'
    id 'com.modrinth.minotaur' version '2.+'
    id 'net.neoforged.moddev' version '2.0.+'
}

repositories {
    maven { url = 'https://maven.fabricmc.net' }
}

group= "team.creative" + project.mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

java.sourceSets {
    main {
        java {
            srcDirs = ["src/main/java", "src/forge/java"]
        }
        resources {
            srcDirs = ["src/main/resources", "src/forge/resources"]
        }
    }
}

neoForge {
    version = "${forge_version}"
    validateAccessTransformers = true

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        CreativeCore {
            sourceSet sourceSets.main
        }
    }
}

modProperties = [ '    displayTest="NONE"' ]
modDependencies = []
modMixins = [ "creativecore.mixins.json", "creativecore.forge.mixins.json" ]
modImplemented = [
    [ name: "net.fabricmc:fabric-loader:${project.fabric_version}", disabled: true ]
]
